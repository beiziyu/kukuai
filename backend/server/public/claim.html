<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✧ 百度网盘会员领取 ✧</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #ffd9ec 0%, #e6d5ff 45%, #c9e4ff 100%);
    overflow-x: hidden; position: relative;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
  }

  /* 触控目标不小于 44px */
  .btn, .btn-ghost { min-height: 48px; }
  input { font-size: 16px; }  /* ≥16px 防 iOS 聚焦自动放大 */

  /* ---- 飘落樱花瓣 ---- */
  .petal { position: fixed; top: -30px; z-index: 0; pointer-events: none; opacity: .85;
           animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translateY(-40px) rotate(0deg) translateX(0); opacity: 0; }
    10%  { opacity: .9; }
    100% { transform: translateY(110vh) rotate(360deg) translateX(60px); opacity: .3; }
  }
  .star-tw { position: fixed; width: 6px; height: 6px; background: #fff; border-radius: 50%;
             pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; z-index: 0; }
  @keyframes twinkle { 0%,100% { opacity: .1; transform: scale(.6);} 50% { opacity: .95; transform: scale(1.3);} }

  /* ---- 主卡片 ---- */
  .card {
    position: relative; z-index: 2; width: 100%; max-width: 400px;
    background: rgba(255,255,255,.92); border-radius: 26px;
    box-shadow: 0 10px 40px rgba(255,130,190,.35), 0 0 0 3px rgba(255,255,255,.6) inset;
    padding: 26px 24px 30px; text-align: center;
    animation: cardIn .6s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.95); } }

  .mascot { width: 120px; height: 120px; margin: -74px auto 6px; display: block;
            filter: drop-shadow(0 6px 12px rgba(255,120,180,.4)); }
  .mascot.float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }

  h1 { font-size: 22px; color: #ff6fae; letter-spacing: 2px; margin-bottom: 4px;
       text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(255,111,174,.3); }
  .sub { font-size: 12px; color: #b48ad4; margin-bottom: 18px; }

  .badge { display: inline-block; font-size: 12px; color: #8a6bbf; background: #f3ecff;
           border: 1px dashed #c9a9f0; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px; }

  /* ---- 输入与按钮 ---- */
  .field { position: relative; margin-bottom: 14px; }
  .field input {
    width: 100%; padding: 13px 16px 13px 42px; font-size: 16px;
    border: 2px solid #ffd3e8; border-radius: 16px; outline: none; background: #fffafb;
    transition: border .2s, box-shadow .2s; color: #6b4a7e;
  }
  .field input:focus { border-color: #ff8fc7; box-shadow: 0 0 0 4px rgba(255,143,199,.18); }
  .field .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; }

  .btn {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700; letter-spacing: 3px;
    color: #fff; background: linear-gradient(90deg, #ff8fc7, #b28aff);
    border: none; border-radius: 999px; cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 6px 18px rgba(255,120,190,.45); transition: transform .15s, box-shadow .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { background: linear-gradient(90deg, #d8c7e8, #c3cdea); cursor: not-allowed; box-shadow: none; }
  .btn::after { content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shine 2.8s infinite; }
  @keyframes shine { 0% { left: -80%; } 60%,100% { left: 130%; } }

  .hint { font-size: 12px; color: #a08ac0; margin-top: 12px; line-height: 1.7; }

  /* ---- 步骤切换动画 ---- */
  .stage { display: none; }
  .stage.on { display: block; animation: stageIn .45s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes stageIn { from { opacity: 0; transform: translateX(26px); } }

  /* ---- 施法过渡动画 ---- */
  .casting {
    display: none; position: fixed; inset: 0; z-index: 50;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    background: radial-gradient(circle at 50% 42%, rgba(120,80,200,.92), rgba(60,30,120,.96));
    flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  .casting.on { display: flex; animation: castIn .4s ease; }
  @keyframes castIn { from { opacity: 0; } }
  .circle { position: relative; width: 180px; height: 180px; margin-bottom: 26px; }
  .circle svg { position: absolute; inset: 0; }
  .c1 { animation: spin 6s linear infinite; }
  .c2 { animation: spinRev 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  .core { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: 42px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .cast-title { font-size: 18px; letter-spacing: 2px; margin-bottom: 10px;
                text-shadow: 0 0 14px rgba(255,180,255,.9); }
  .cast-detail { font-size: 13px; opacity: .85; min-height: 20px; }
  .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; background: #ffb3ec;
               border-radius: 50%; animation: bounce 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }

  /* ---- 成功界面 ---- */
  .success-wrap { position: relative; }
  .big-ok { font-size: 64px; line-height: 1; margin-bottom: 6px;
            animation: pop .55s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } }
  .ok-title { font-size: 26px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(90deg, #ff6fae, #b28aff, #5bb8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: okGlow 1.6s ease-in-out infinite alternate; margin-bottom: 8px; }
  @keyframes okGlow { from { filter: brightness(1); } to { filter: brightness(1.25) drop-shadow(0 0 12px rgba(255,120,190,.7)); } }
  .expire { display: inline-block; margin: 8px 0 4px; padding: 10px 22px; font-size: 16px;
            font-weight: 700; color: #7a4ba8; background: linear-gradient(120deg, #fff0fa, #f0e8ff);
            border: 2px solid #e3c9ff; border-radius: 16px; }
  .expire small { display: block; font-size: 11px; color: #b09ad0; font-weight: 400; margin-bottom: 2px; }
  .fire { position: absolute; font-size: 22px; animation: burst 1.1s ease-out forwards; opacity: 0; }
  @keyframes burst { 0% { transform: translate(0,0) scale(.4); opacity: 1; }
                     100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; } }

  /* ---- 小屏适配 ---- */
  @media (max-width: 380px) {
    .mascot { width: 96px; height: 96px; margin-top: -58px; }
    h1 { font-size: 19px; }
    .card { padding: 20px 16px 24px; border-radius: 22px; }
    .big-ok { font-size: 52px; }
    .ok-title { font-size: 22px; letter-spacing: 2px; }
    .expire { font-size: 14px; padding: 8px 16px; }
    .circle { width: 140px; height: 140px; }
    .core { font-size: 32px; }
    .cast-title { font-size: 16px; }
  }
  /* ---- 横屏矮屏 ---- */
  @media (max-height: 620px) {
    .mascot { width: 84px; height: 84px; margin-top: -52px; }
    .card { padding: 16px 18px 20px; }
    .sub { margin-bottom: 10px; }
  }

  /* ---- 失败 ---- */
  .fail-title { font-size: 22px; color: #ff5f8f; font-weight: 700; margin-bottom: 8px; }
  .btn-ghost { width: 100%; padding: 12px; margin-top: 14px; font-size: 14px; font-weight: 600;
    color: #b06ad0; background: #fff; border: 2px solid #e6c9f5; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>

<!-- 主界面 -->
<div class="card">
  <!-- 二次元魔法少女立绘 (SVG) -->
  <svg class="mascot float" viewBox="0 0 120 120">
    <!-- 双马尾 -->
    <path d="M28 58 Q14 74 20 98 Q30 92 34 78 Z" fill="#ff9fd0"/>
    <path d="M92 58 Q106 74 100 98 Q90 92 86 78 Z" fill="#ff9fd0"/>

    <circle cx="46.5" cy="65" r="1.1" fill="#ffd9f2"/>
    <circle cx="70.5" cy="65" r="1.1" fill="#ffd9f2"/>
    <!-- 腮红 -->

    <ellipse cx="78" cy="70" rx="4.5" ry="2.6" fill="#ffb9c9" opacity=".85"/>
    <!-- 微笑 -->
    <path d="M56 72 Q60 76 64 72" stroke="#d4739c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 星星发饰 -->
    <path d="M84 36 l2.2 4.4 4.8.6 -3.5 3.4.9 4.8 -4.4-2.3 -4.4 2.3.9-4.8 -3.5-3.4 4.8-.6Z" fill="#ffd54d" stroke="#f5b82e" stroke-width="1"/>
    <!-- 小音符 -->
    <text x="14" y="42" font-size="12" fill="#c9a9f0">♪</text>
    <text x="98" y="52" font-size="10" fill="#ff9fd0">♪</text>
  </svg>

  <h1>百度网盘会员领取</h1>
  <div class="sub">✧ 输入网盘绑定的手机号, 开通网盘会员 ✧</div>

  <!-- 卡密状态徽章 -->
  <div id="cardBadge" class="badge" style="display:none"></div>

  <!-- 步骤1: 手机号 -->
  <div id="stPhone" class="stage">
    <div class="field">
      <svg class="icon" viewBox="0 0 1024 1024" width="18" height="18"><path d="M769.741155 818.878273c19.076474-10.622942 36.922934-21.412682 51.501978-32.199353 1.639337-1.25969 8.851599-6.293333 10.637268-7.753591 8.085142-6.687306 13.33368-16.769942 13.33368-28.096918 0-10.790764-4.701069-20.551058-12.245905-27.00812L684.33602 601.314165c-6.121418-5.01113-14.028505-8.073886-22.679535-8.073886-9.724479 0-18.550495 3.755534-25.043373 9.865695-2.526543 2.52552-24.843828 25.39539-24.843828 25.39539-15.477506 15.514345-40.525995 15.514345-56.002478 0L404.097478 476.679563c-15.487739-15.476483-15.487739-40.704051 0-56.181557l24.677029-24.690332c6.482645-6.467295 10.263761-15.476483 10.263761-25.175379 0-9.750061-3.78214-18.398022-9.907651-24.880667L301.805744 191.930287c-6.6607-7.942903-16.746406-13.145391-27.916816-13.145391-11.878538 0-22.320355 5.753027-28.993335 14.580067l-2.179642 2.87242c-27.734668 37.474496-63.931055 96.93268-63.931055 152.757103 0 153.833621 342.93856 496.220618 495.312946 496.220618 2.87242 0 5.731538-0.203638 8.457626-0.203638C722.086809 841.831031 752.133126 828.708152 769.741155 818.878273L769.741155 818.878273zM769.741155 818.878273" fill="#D18CE8"></path></svg>
      <input id="phone" type="tel" maxlength="11" placeholder="请输入手机号充值">
    </div>
    <button class="btn" id="btnSend" onclick="createAndSend()">获取验证码</button>
    <div class="hint">提交后自动为您开通会员</div>
    <div class="msg hint" id="msg1"></div>
  </div>

  <!-- 步骤2: 验证码 + 充值 -->
  <div id="stCode" class="stage">
    <div class="field">
      <span class="icon">💌</span>
      <input id="code" type="tel" maxlength="6" placeholder="请输入短信验证码">
    </div>
    <button class="btn" id="btnVerify" onclick="submitCode()">✨ 充 值 ✨</button>
    <div class="hint">提交后自动为您开通会员</div>
    <div class="msg hint" id="msg2"></div>
  </div>

  <!-- 步骤3: 结果 -->
  <div id="stResult" class="stage">
    <div id="resultBox"></div>
  </div>
</div>

<!-- 施法过渡 -->
<div class="casting" id="casting">
  <div class="circle">
    <svg class="c1" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="80" fill="none" stroke="#d5b3ff" stroke-width="1.5" stroke-dasharray="6 10" opacity=".9"/>
      <circle cx="90" cy="90" r="64" fill="none" stroke="#ffb3ec" stroke-width="1.5" stroke-dasharray="14 8"/>
      <path d="M90 26 L98 82 L154 90 L98 98 L90 154 L82 98 L26 90 L82 82 Z" fill="none" stroke="#e0c3ff" stroke-width="1.2"/>
    </svg>
    <svg class="c2" viewBox="0 0 180 180">
      <path d="M90 40 L104 76 L142 90 L104 104 L90 140 L76 104 L38 90 L76 76 Z" fill="none" stroke="#ffd54d" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="46" fill="none" stroke="#9ee7ff" stroke-width="1.2" stroke-dasharray="4 6"/>
    </svg>
    <div class="core">🪄</div>
  </div>
  <div class="cast-title" id="castTitle">正在为你施法…</div>
  <div class="cast-detail" id="castDetail">连接魔法网络</div>
  <div class="dots" style="margin-top:14px"><span></span><span></span><span></span></div>
</div>

<script>
/* ---------- 樱花与星星背景 ---------- */
(function () {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = ['🌸', '🌸', '🌸', '💮'][i % 4];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (10 + Math.random() * 12) + 'px';
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (-Math.random() * 10) + 's';
    document.body.appendChild(p);
  }
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'star-tw';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    document.body.appendChild(s);
  }
})();

/* ---------- 步骤管理 ---------- */
function showStage(id) {
  ['stPhone', 'stCode', 'stResult'].forEach(s =>
    document.getElementById(s).classList.toggle('on', s === id));
}
function setMsg(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text || '';
  el.style.color = cls === 'err' ? '#e05a8a' : '';
}

/* ---------- 卡密预检 (URL ?card=) ---------- */
// 兼容两种参数名: ?kami= (管理端复制) / ?card=
const CARD_KEY = new URLSearchParams(location.search).get('kami') 
  || new URLSearchParams(location.search).get('card') || '';

async function checkCard() {
  const badge = document.getElementById('cardBadge');
  if (!CARD_KEY) {
    badge.style.display = 'block';
    badge.textContent = '⚠ 未检测到卡密, 请在链接中携带 ?card=卡密';
    badge.style.color = '#e05a8a';
    return;
  }
  badge.style.display = 'block';
  badge.textContent = '🔍 正在校验卡密 …';
  try {
    const r = await fetch('/api/client/card/check?card_key=' + encodeURIComponent(CARD_KEY))
      .then(x => x.json());
    if (!r.ok) {
      // 已成功的卡 → 徽章显示兑换成功 + 直接显示成功界面
      if (r.last_status === 'success' || r.msg === '卡密已被使用') {
        badge.textContent = '✅ 卡密兑换成功';
        badge.style.color = '#2e9e5b';
        badge.style.borderColor = '#9fdcb4';
        showSuccess(r.member_expire_at, r.avatar, r.username);
        return;
      }
      badge.textContent = '❌ ' + r.msg;
      badge.style.color = '#e05a8a';
      document.getElementById('stPhone').classList.remove('on');
      return;
    }
    // 失败过的卡 → 卡密本身【仍然有效】(失败不核销), 允许客户重新走一遍
    //   (重新输手机号 → 重新发验证码 → 新设备指纹 + 新 IP, 相当于新的一次领取)
    //   失败次数达到上限(fail_count >= 2) → 锁定, 引导走退款流程
    if (r.last_status === 'failed') {
      const fc = Number(r.fail_count) || 0;
      if (fc >= 2) {
        // 已达上限 → 锁定, 不再让客户重试
        badge.textContent = '领取失败, 请联系客服退款';
        badge.style.color = '#c97a2b';
        badge.style.borderColor = '#f0c9a0';
        showFail('如二次失败可联系客服退款', true);
        return;
      }
      // 还能重试 → 提示后直接落到手机号输入页
      badge.textContent = '上次领取未成功, 请重试';
      badge.style.color = '#c97a2b';
      badge.style.borderColor = '#f0c9a0';
      showStage('stPhone');
      const phoneEl = document.getElementById('phone');
      if (phoneEl) { phoneEl.focus(); }
      setMsg('msg1', '上次领取未成功, 请重新输入手机号领取 (如二次失败可联系客服退款)', 'err');
      return;
    }
    // 处理中的卡 → 显示等待提示 (后台自动重领中)
    if (r.last_status === 'running' || r.last_status === 'pending') {
      badge.textContent = '⏳ 上次领取处理中, 请稍后刷新查看结果';
      document.getElementById('stPhone').classList.remove('on');
      return;
    }
    badge.textContent = '✨ 卡密有效' + (r.note ? ' · ' + r.note : '');
  } catch (e) {
    badge.textContent = '网络异常, 请刷新重试';
    badge.style.color = '#e05a8a';
  }
  showStage('stPhone');
}

/* ---------- 手机号 → 发送短信 ---------- */
let orderId = null, sessionId = null, pollTimer = null;

async function createAndSend() {
  const phone = document.getElementById('phone').value.trim();
  if (!/^1\d{10}$/.test(phone)) return setMsg('msg1', '手机号格式不正确', 'err');
  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  const t0 = Date.now();
  btn.textContent = '魔法连接中… (0s)';
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    btn.textContent = `魔法连接中… (${s}s)`;
    setMsg('msg1', s > 8 ? '正在切换线路重试, 请稍候…' : '');
  }, 1000);
  const stopTick = () => { clearInterval(tick); btn.textContent = '获取验证码'; };
  try {
    const s = await post('/api/client/sms/send', { phone, kami: CARD_KEY });
    if (!s.ok) { stopTick(); setMsg('msg1', s.msg || '发送失败', 'err'); btn.disabled = false; return; }
    stopTick();
    showStage('stCode');
    setMsg('msg2', '验证码已飞到你手机啦 🕊️');
  } catch (e) {
    stopTick(); setMsg('msg1', '网络异常, 请重试', 'err'); btn.disabled = false;
  }
}

/* ---------- 充值 → 施法动画 → 轮询 ---------- */
async function submitCode() {
  const code = document.getElementById('code').value.trim();
  const phone = document.getElementById('phone').value.trim();   // ⚠️ 必须取输入值(不是DOM元素)
  if (!code) return setMsg('msg2', '请输入验证码', 'err');
  if (!/^1\d{10}$/.test(phone)) return setMsg('msg2', '手机号无效, 请返回重新获取', 'err');
  const btn = document.getElementById('btnVerify');
  btn.disabled = true;
  let r;
  try {
    r = await post('/api/client/claim', { phone, code, card_key: CARD_KEY });
  } catch (e) {
    setMsg('msg2', '网络异常, 请重试', 'err'); btn.disabled = false; return;
  }
  if (!r.success && !r.ok) { setMsg('msg2', r.msg || '提交失败', 'err'); btn.disabled = false; return; }
  if (r.already) {
    // 该卡已兑换成功过 → 直接显示已有结果
    document.getElementById('casting').classList.remove('on');
    showSuccess(r.member_expire_at, r.avatar, r.username);
    return;
  }

  // 施法过渡
  document.getElementById('casting').classList.add('on');
  const castDetail = document.getElementById('castDetail');
  const seq = ['连接魔法网络', '校验账户信息', '激活会员权益', '即将完成'];
  let si = 0;
  const seqTimer = setInterval(() => {
    si = (si + 1) % seq.length;
    castDetail.textContent = seq[si];
  }, 2600);

  let pollFails = 0;
  const pollStart = Date.now();
  pollTimer = setInterval(async () => {
    try {
      const st = await fetch(`/api/client/claim/status?kami=${encodeURIComponent(CARD_KEY)}`).then(x => x.json());
      if (st.progress) setMsg('msg1', st.progress);
      pollFails = 0;
      if (st.detail) castDetail.textContent = st.detail;
      if (st.status === 'success') {
        clearInterval(pollTimer); clearInterval(seqTimer);
        document.getElementById('casting').classList.remove('on');
        showSuccess(st.member_expire_at, st.avatar, st.username);
      } else if (st.status === 'failed') {
        clearInterval(pollTimer); clearInterval(seqTimer);
        document.getElementById('casting').classList.remove('on');
        showFail(st.result || st.detail || '未知原因');
      } else if (Date.now() - pollStart > 420000) {
        // 7分钟仍未完成 → 提示稍后刷新 (后台重领仍会继续)
        clearInterval(pollTimer); clearInterval(seqTimer);
        document.getElementById('casting').classList.remove('on');
        showFail('处理超时, 请稍后刷新页面查看结果');
      }
    } catch (e) {
      pollFails++;
      if (pollFails >= 5) {
        clearInterval(pollTimer); clearInterval(seqTimer);
        document.getElementById('casting').classList.remove('on');
        showFail('网络异常, 请刷新页面重试');
      }
    }
  }, 3000);
}

/* ---------- 成功界面 (二次元 + 到期时间) ---------- */
function showSuccess(expire, avatar, uname) {
  showStage('stResult');
  const box = document.getElementById('resultBox');
  box.innerHTML = `
    <div class="success-wrap">
      <div class="big-ok">🎉</div>
      <div class="ok-title">充值成功</div>
      <div class="sub" style="margin-bottom:10px">✧ 网盘会员已发放至你的账户 ✧</div>
      ${avatar ? `<img src="${avatar}" style="width:64px;height:64px;border-radius:50%;
                   border:3px solid #ffb3dd;box-shadow:0 4px 12px rgba(255,130,190,.4);
                   margin-bottom:8px" />` : ''}
      ${uname ? `<div style="font-size:15px;font-weight:700;color:#7a4ba8;margin-bottom:8px">${uname}</div>` : ''}
      <div class="expire"><small>会员到期时间</small>${expire || '请在网盘App查看'}</div>
      <div class="hint">会员已自动到账, 请查收 ✧<br>本卡密已完成使命, 请妥善保管</div>
    </div>`;
  // 星星迸发
  ['✦', '✧', '⭐', '🌸', '✦', '✧', '⭐', '🌸'].forEach((c, i) => {
    const f = document.createElement('span');
    f.className = 'fire'; f.textContent = c;
    f.style.left = '50%'; f.style.top = '110px';
    f.style.setProperty('--dx', (Math.cos(i / 8 * 6.28) * 130) + 'px');
    f.style.setProperty('--dy', (Math.sin(i / 8 * 6.28) * 110 - 30) + 'px');
    f.style.animationDelay = (i * 0.06) + 's';
    box.querySelector('.success-wrap').appendChild(f);
  });
}

function showFail(msgText, locked) {
  showStage('stResult');
  // locked=true: 已达失败次数上限, 引导退款 (不再提供重试入口)
  // locked=false/undefined: 可重试 → 按钮直接切回手机号输入页重新走一遍
  const btn = locked
    ? `<div class="sub">如需退款请联系客服</div>`
    : `<button class="btn-ghost" onclick="retryNow()">重新尝试</button>`;
  document.getElementById('resultBox').innerHTML = `
    <div class="fail-title">领取失败</div>
    <div class="sub">${msgText}</div>
    ${btn}`;
}

// 重新尝试: 回到手机号输入页, 客户重新输手机号 → 重新发验证码 →
//          全新的设备指纹 + 全新的 IP, 相当于新的一次领取
function retryNow() {
  orderId = null; sessionId = null;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const badge = document.getElementById('cardBadge');
  if (badge) { badge.textContent = '请重新输入手机号继续领取'; badge.style.color = '#c97a2b'; badge.style.borderColor = '#f0c9a0'; }
  showStage('stPhone');
  const phone = document.getElementById('phone');
  if (phone) { phone.value = ''; phone.focus(); }
}

async function post(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) }).then(x => x.json());
}

checkCard();
</script>
